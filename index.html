    <!-- New Hero is self-hosted from public/fonts — no Google Fonts, so no
         third-party connection and no render-blocking stylesheet.

         Only the three faces used above the fold are preloaded: Regular (body),
         Medium (nav) and SemiBold (headings). Bold and every italic are below
         the fold and load normally. Vite rewrites these with the configured
         base at build time, same as the CSS url()s.

         `crossorigin` is required on font preloads even same-origin — without
         it the browser fetches the file twice. -->
    <link rel="preload" href="/Fortiva-concept/fonts/NewHero-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/Fortiva-concept/fonts/NewHero-Medium.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/Fortiva-concept/fonts/NewHero-SemiBold.otf" as="font" type="font/otf" crossorigin />
    <script type="module" crossorigin src="/Fortiva-concept/assets/index-CsjOYsgn.js"></script>
    <link rel="stylesheet" crossorigin href="/Fortiva-concept/assets/index-CT00h1a9.css">
  </head>
